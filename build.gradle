plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.4.3'
}

shadowJar {
    relocate 'org.apache.commons.net', 'your.plugin.shaded.org.apache.commons.net'
    archiveClassifier.set("") // Remove the "-all" suffix
}

group = 'tr.alperendemir'

// Version: the base lives in gradle.properties (versionBase). Alpha/dev builds (-Palpha, which is
// what CI publishes to Modrinth as an alpha) append the short git SHA, e.g. 1.3.1-b1d49ff, so a dev
// jar can be traced to the exact commit it came from. plugin.yml gets the same string via
// processResources below, so /version AutoBackup reports it on a live server.
// The SHA is resolved at configuration time; with Gradle's configuration cache enabled locally a
// cache hit could reuse a stale SHA. CI never enables it, so published versions are always correct.
def versionBase = providers.gradleProperty('versionBase').getOrElse('0.0.0')
def resolveShortSha = {
    def override = providers.gradleProperty('versionSha').getOrNull()
    if (override) {
        return override.trim()
    }
    try {
        def proc = ['git', 'rev-parse', '--short', 'HEAD'].execute()
        proc.waitFor()
        return proc.exitValue() == 0 ? proc.text.trim() : ''
    } catch (Exception ignored) {
        return '' // e.g. building from a source archive with no git checkout
    }
}
def alphaSha = project.hasProperty('alpha') ? resolveShortSha() : ''
version = alphaSha ? "${versionBase}-${alphaSha}" : versionBase

repositories {
    mavenCentral()
    maven {
        name = "spigotmc-repo"
        url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
}

dependencies {
    compileOnly("org.spigotmc:spigot-api:26.3-R0.1-SNAPSHOT")
    implementation("commons-net:commons-net:3.9.0")
    implementation('com.dropbox.core:dropbox-core-sdk:7.0.0') {
        exclude group: 'com.fasterxml.jackson.core', module: 'jackson-core'
        exclude group: 'com.google.code.findbugs', module: 'jsr305'
        exclude group: 'com.fasterxml.jackson', module: 'jackson-bom'
    }
}

def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

// shadowJar with an empty classifier intentionally overwrites the plain jar: the shaded jar (with
// commons-net and dropbox-core-sdk bundled) is the ONLY publishable artifact here. CI therefore
// builds `shadowJar` directly rather than `build`, so a thin jar can never be published by accident.

// Lets CI read the resolved version: ./gradlew clean shadowJar printVersion -Palpha=true
def resolvedVersion = version.toString()
tasks.register('printVersion') {
    description = 'Prints the resolved project version as VERSION=<version>.'
    doLast {
        println "VERSION=$resolvedVersion"
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
    filesMatching('config.yml') {
        expand props
    }
}
